{% extends "base.html" %}{% block content %}<section class="form-wrap"><p class="eyebrow">GET STARTED</p><h1>Create account</h1><p class="muted">Create a portal account. No payment details are requested.</p><form method="post"><label>Username</label><input name="username" required minlength="3" autocomplete="username"><label>Email</label><input name="email" type="email" required autocomplete="email"><label>Password (8+ characters)</label><input name="password" type="password" required minlength="8" autocomplete="new-password"><button class="button" type="submit">Create account</button></form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section>{% endblock %}
